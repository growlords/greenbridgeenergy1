<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gpe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Orbital Ring 1 -->
  <circle cx="50" cy="50" r="42" stroke="url(#gpe-grad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6"/>
  <!-- Orbital Ring 2 (Tilted) -->
  <ellipse cx="50" cy="50" rx="46" ry="20" stroke="url(#gpe-grad)" stroke-width="1.5" transform="rotate(-30 50 50)" opacity="0.4"/>
  <!-- Central Solar Hex / Diamond Core -->
  <path d="M50 16 L78 32 L78 68 L50 84 L22 68 L22 32 Z" fill="#061a11" stroke="url(#gpe-grad)" stroke-width="3"/>
  <!-- Inner Solar PV Cells Grid -->
  <path d="M50 18 L50 82" stroke="url(#gpe-grad)" stroke-width="1.5" opacity="0.7"/>
  <path d="M24 33 L76 67" stroke="url(#gpe-grad)" stroke-width="1.2" opacity="0.5"/>
  <path d="M24 67 L76 33" stroke="url(#gpe-grad)" stroke-width="1.2" opacity="0.5"/>
  <!-- Central Energy Core -->
  <circle cx="50" cy="50" r="11" fill="url(#gold-grad)" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="5" fill="#ffffff"/>
  <!-- Orbiting photon nodes -->
  <circle cx="86" cy="30" r="4.5" fill="url(#gold-grad)"/>
  <circle cx="14" cy="70" r="3.5" fill="#10b981"/>
</svg>
